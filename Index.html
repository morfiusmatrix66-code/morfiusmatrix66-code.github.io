let lang="ru";
function apply(){
  const d=I18N[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    if(d[k]==null)return;
    if(k==="hero.title")el.innerHTML=d[k];else el.textContent=d[k];
  });
  document.title=lang==="ru"?"Владислав · D Creator — сайты под ключ, SEO, ИИ-интеграции":"Vladislav · D Creator — end-to-end websites, SEO, AI integrations";
  const md=document.querySelector('meta[name="description"]');
  md.content=lang==="ru"?"Веб-разработчик с 6+ годами опыта: разработка, редизайн, SEO, реклама и ИИ-интеграции. Сайты, которые приносят заявки.":"Web developer with 6+ years: development, redesign, SEO, ads and AI integrations. Websites that bring leads.";
  $("lang").textContent=lang==="ru"?"EN":"RU";
}
function $(id){return document.getElementById(id)}
$("lang").onclick=()=>{lang=lang==="ru"?"en":"ru";apply()};
$("burger").onclick=()=>$("links").classList.toggle("open");
document.querySelectorAll("#links a").forEach(a=>a.onclick=()=>$("links").classList.remove("open"));
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
const cv=$("fx"),cx=cv.getContext("2d");const dpr=Math.min(2,devicePixelRatio||1);
let W,H,ps=[];
function fit(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  ps=Array.from({length:Math.min(70,Math.round(W/22))},()=>({x:Math.random()*W,y:Math.random()*H,r:.6+Math.random()*1.6,s:.05+Math.random()*.18,p:Math.random()*6.28,c:Math.random()}));}
addEventListener("resize",fit);fit();
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
function tick(t){cx.clearRect(0,0,W,H);
  if(!reduced&&!document.hidden){for(const p of ps){p.y-=p.s;if(p.y<-4)p.y=H+4;
    cx.fillStyle=p.c>.6?"rgba(0,224,255,"+(0.10+0.16*Math.abs(Math.sin(t/900+p.p)))+")":"rgba(242,246,252,"+(0.06+0.12*Math.abs(Math.sin(t/900+p.p)))+")";
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();}}
  requestAnimationFrame(tick);}
requestAnimationFrame(tick);
apply();
</script>
